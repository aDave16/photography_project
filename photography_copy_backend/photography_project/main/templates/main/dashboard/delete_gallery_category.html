{% extends 'main/dashboard/base.html' %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-12">
    <div class="dash-card p-10 text-center">
        <div class="w-20 h-20 bg-red-500/10 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg class="w-10 h-10 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
        </div>
        
        <h1 class="text-3xl font-light playfair text-white mb-4">Delete Category?</h1>
        <p class="text-white/50 mb-8 leading-relaxed">
            Are you sure you want to delete the category <span class="text-white font-semibold">"{{ category.name }}"</span>? 
            This action cannot be undone and will affect all images and reels associated with it.
        </p>

        <form method="post" class="flex flex-col sm:flex-row gap-4 justify-center">
            {% csrf_token %}
            <a href="{% url 'dashboard_gallery_categories' %}" class="px-10 py-3 rounded-full border border-white/10 text-white/70 hover:bg-white/5 text-sm uppercase tracking-widest font-semibold transition-all">
                Cancel
            </a>
            <button type="submit" class="px-10 py-3 rounded-full bg-red-600 hover:bg-red-700 text-white shadow-[0_4px_15px_rgba(220,38,38,0.3)] text-sm uppercase tracking-widest font-bold transition-all transform hover:-translate-y-0.5">
                Delete Permanently
            </button>
        </form>
    </div>
</div>
{% endblock %}
