{% extends 'main/dashboard/base.html' %}
{% load static %}

{% block title %}Edit Gallery Category{% endblock %}

{% block content %}

<div class="p-8">

    <div class="flex items-center justify-between mb-8">
        <h1 class="text-3xl font-bold text-white">
            Edit Gallery Category
        </h1>

        <a href="{% url 'dashboard_gallery_categories' %}"
           class="bg-yellow-500 hover:bg-yellow-400 text-black px-5 py-2 rounded-lg font-semibold transition">
            Back
        </a>
    </div>

    <div class="bg-[#111] border border-gray-800 rounded-2xl p-8">

        <form method="POST" class="space-y-6">

            {% csrf_token %}

            <div>
                <label class="block text-sm text-gray-300 mb-2">
                    Category Name
                </label>

                <input
                    type="text"
                    name="name"
                    value="{{ category.name }}"
                    class="w-full bg-white text-black px-4 py-3 rounded-lg outline-none"
                    required
                >
            </div>

            <div>
                <label class="block text-sm text-gray-300 mb-2">
                    Description
                </label>

                <textarea
                    name="description"
                    rows="5"
                    class="w-full bg-white text-black px-4 py-3 rounded-lg outline-none"
                >{{ category.description }}</textarea>
            </div>

            <div>
                <label class="block text-sm text-gray-300 mb-2">
                    Display Order
                </label>

                <input
                    type="number"
                    name="display_order"
                    value="{{ category.display_order }}"
                    class="w-full bg-white text-black px-4 py-3 rounded-lg outline-none"
                >
            </div>
            <div class="flex items-center">
                <input type="checkbox" name="is_active" id="is_active" {% if category.is_active %}checked{% endif %}>
                <label for="is_active" class="ml-2 text-sm text-gray-300">
                    Active Category
                </label>
            </div>
            <button
                type="submit"
                class="bg-yellow-500 hover:bg-yellow-400 text-black px-8 py-3 rounded-lg font-semibold transition"
            >
                Save Category
            </button>

        </form>

    </div>

</div>

{% endblock %}
```
