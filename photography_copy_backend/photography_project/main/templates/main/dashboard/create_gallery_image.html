{% extends 'main/dashboard/base.html' %}

{% block content %}

<h2>Upload Gallery Image</h2>

<form method="POST"    action="{% url 'upload_gallery_images' %}" enctype="multipart/form-data">

    {% csrf_token %}

    {{ form.as_p }}

    <button type="submit">
        Upload Image
    </button>

</form>

{% endblock %}
